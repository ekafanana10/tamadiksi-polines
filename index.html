<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamadiksi Polines</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; color: #333; font-family: sans-serif; }
        .hero-section { background: #fff; padding: 40px 20px; border-bottom: 3px solid #0d6efd; }
        .card-custom { border: none; border-radius: 12px; background: #fff; }
        .section-title { font-weight: 700; color: #2c3e50; margin: 30px 0 20px 0; border-left: 5px solid #0d6efd; padding-left: 15px; }
        .btn-action { border-radius: 8px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container py-4">
        <!-- Header -->
        <div class="hero-section text-center rounded shadow-sm mb-4">
            <h1 class="h3 fw-bold text-primary mb-1">KAMADIKSI POLINES</h1>
            <p class="text-muted small">Portal Administrasi Internal</p>
        </div>

        <!-- Section Absensi -->
        <h4 class="section-title">Absensi Rapat</h4>
        <div class="row g-3">
            <div class="col-6">
                <a href="#" class="btn btn-primary w-100 btn-action shadow-sm">
                    <i class="bi bi-calendar-check"></i> Rapat Proker
                </a>
            </div>
            <div class="col-6">
                <a href="#" class="btn btn-outline-primary w-100 btn-action">
                    <i class="bi bi-people"></i> Rapat Divisi
                </a>
            </div>
        </div>

        <!-- Section Agenda Kegiatan -->
        <h4 class="section-title">Agenda Kegiatan</h4>
        <div class="card card-custom p-3 shadow-sm mb-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Tanggal</th>
                            <th>Kegiatan</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>25 Juli 2026</td>
                            <td>Rapat Koordinasi Bulanan</td>
                        </tr>
                        <tr>
                            <td>05 Agustus 2026</td>
                            <td>Proker Bidang Kesejahteraan</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Section Data Pengurus -->
        <h4 class="section-title">Data Pengurus</h4>
        <div class="card card-custom p-3 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nama</th>
                            <th>Jabatan</th>
                            <th>Kontak</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Nama Pengurus</td>
                            <td>Ketua</td>
                            <td><a href="#" class="btn btn-sm btn-success"><i class="bi bi-whatsapp"></i></a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
